name: CI/CD Password Strength Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout кода
      uses: actions/checkout@v4

    - name: Настройка Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov flake8

    - name: Проверка линтером (Flake8)
      run: |
        flake8 src/ tests/ --max-line-length=120

    - name: Запуск автоматических тестов
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing

  deploy-docs:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout кода
      uses: actions/checkout@v4

    - name: Подготовка документации для публикации
      run: |
        mkdir -p public
        cp -r docs/* public/
        echo "<h1>Password Strength Analyzer</h1><p>Версия: $GITHUB_SHA</p><p>Статус: Тесты пройдены успешно.</p>" > public/index.html

    - name: Деплой на GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
