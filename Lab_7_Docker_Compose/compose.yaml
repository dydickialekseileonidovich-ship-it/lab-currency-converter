version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: scholarship_postgres_db
    restart: always
    environment:
      POSTGRES_DB: scholarship_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secret
    ports:
      - "5433:5432"  # Внешний порт 5433 во избежание конфликта с локальным PG
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scholarship_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: scholarship_api_service
    restart: always
    environment:
      DB_HOST: db
      DB_NAME: scholarship_db
      DB_USER: postgres
      DB_PASSWORD: postgres_secret
      DB_PORT: 5432
    ports:
      - "8080:5000"  # Наружу порт 8080, внутри контейнера 5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
