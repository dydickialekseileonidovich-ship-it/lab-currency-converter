services:
  db:
    image: postgres:15-alpine
    container_name: scholarship_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-scholarship_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_local}
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - scholarship_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-scholarship_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: scholarship_api_service
    restart: always
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-scholarship_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_local}
      DB_PORT: ${DB_PORT:-5432}
    ports:
      - "${API_EXTERNAL_PORT:-8080}:5000"
    networks:
      - scholarship_net
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

networks:
  scholarship_net:
    driver: bridge
